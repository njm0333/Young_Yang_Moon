<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영양문 모바일 - 주식주문</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #FFFFFF;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: #000000; overflow: hidden;
            -webkit-user-select: none; user-select: none;
        }
        .wrapper { display: flex; flex-direction: column; height: 100%; }
        header { background-color: #55B2B5; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; color: #FFFFFF; }
        .header-left { display: flex; align-items: center; gap: 18px; }
        .back-arrow { font-size: 1.4rem; font-weight: 300; cursor: pointer; }
        .header-tabs { display: flex; gap: 16px; font-size: 1.1rem; font-weight: bold; }
        .header-tabs span { opacity: 0.8; cursor: pointer; }
        .header-tabs span.active { opacity: 1; border-bottom: 2px solid #FFFFFF; padding-bottom: 2px; }
        .header-right { font-size: 1.3rem; cursor: pointer; opacity: 0.9; }

        .stock-info-link { text-decoration: none; color: inherit; display: block; }
        .stock-info-bar { background-color: #FFFFFF; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E5E5E5; }
        .stock-info-bar:active { background-color: #F5F5F5; }
        .stock-title-box { display: flex; flex-direction: column; gap: 4px; }
        .stock-title-row { display: flex; align-items: center; gap: 6px; }
        .star-icon { color: #CCCCCC; font-size: 1.2rem; }
        .stock-title-box h3 { margin: 0; font-size: 1.05rem; font-weight: bold; color: #222222; }
        .search-icon { color: #888888; font-size: 1rem; margin-left: 2px; }
        .stock-tags { display: flex; gap: 4px; font-size: 0.75rem; align-items: center; }
        .tag-free { background-color: #F0F0F0; border: 1px solid #DDD; padding: 1px 3px; color: #666; border-radius: 2px; }
        .tag-percent { background-color: #FCE4F4; border: 1px solid #F9C2E3; padding: 1px 3px; color: #B93382; font-weight: bold; border-radius: 2px; }
        .tag-code { color: #888888; }
        .stock-price-box { text-align: right; }
        .current-price { font-size: 1.6rem; font-weight: bold; color: #2B66CC; margin: 0; letter-spacing: -0.5px; }
        .price-change { font-size: 0.8rem; color: #2B66CC; margin: 2px 0 0 0; font-weight: 500; }

        .account-bar { background-color: #FFFFFF; padding: 6px 12px; display: flex; gap: 6px; border-bottom: 1px solid #E5E5E5; align-items: center; }
        .tag-yui { border: 1px solid #CCC; color: #555; padding: 5px 8px; font-size: 0.8rem; border-radius: 3px; }
        .select-box { background-color: #FFFFFF; border: 1px solid #CCCCCC; color: #333; padding: 6px 8px; font-size: 0.9rem; border-radius: 3px; flex: 1; height: 34px; box-sizing: border-box; }
        .input-box { background-color: #FFFFFF; border: 1px solid #CCCCCC; color: #333; padding: 6px 8px; font-size: 0.9rem; border-radius: 3px; max-width: 95px; height: 34px; box-sizing: border-box; }
        .btn-square-sm { background-color: #FFFFFF; border: 1px solid #CCCCCC; color: #333; padding: 0 10px; font-size: 0.85rem; border-radius: 3px; height: 34px; cursor: pointer; }

        .order-action-tabs { display: flex; border-bottom: 1px solid #D5D5D5; background-color: #FFFFFF; }
        .action-tab { flex: 1; text-align: center; padding: 12px 0; font-size: 1.1rem; font-weight: bold; color: #666666; cursor: pointer; }
        .action-tab.buy { color: #C13966; border-bottom: 3px solid #C13966; font-weight: 900; }
        .action-tab.more { max-width: 45px; color: #999; font-weight: normal; }

        .sub-menu-bar { display: flex; background-color: #FFFFFF; border-bottom: 1px solid #E5E5E5; }
        .sub-menu-item { flex: 1; text-align: center; padding: 9px 0; font-size: 0.85rem; color: #555555; font-weight: 500; }
        .sub-menu-item.active { color: #000000; font-weight: bold; border-bottom: 2px solid #333333; }

        .trade-container { flex: 1; display: flex; overflow: hidden; background-color: #FFFFFF; }

        /* 📊 호가창 스타일 고도화 */
        .hoga-window { width: 42%; border-right: 1px solid #E5E5E5; overflow-y: auto; }
        .hoga-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 8px; font-size: 0.95rem; border-bottom: 1px solid #EEF1F6; height: 42px; box-sizing: border-box; }
        .hoga-row.ask { background-color: #EDF4FC; color: #1E50A2; }
        .hoga-row.ask.highlight-bg { background-color: #E2ECFA; }
        .hoga-row.bid { background-color: #FDF0F6; color: #D9383A; }
        .hoga-price { font-weight: bold; display: flex; flex-direction: column; line-height: 1.2; }
        .hoga-won { font-size: 0.72rem; color: #888888; font-weight: normal; margin-top: 1px; }
        .hoga-rate { font-size: 0.75rem; text-align: right; padding-right: 4px; flex: 1; }
        .hoga-volume { font-size: 0.8rem; color: #333333; text-align: right; width: 42px; padding-right: 2px; font-weight: bold; }

        .order-form { width: 58%; padding: 8px; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-color: #FFFFFF; justify-content: flex-start; }
        .form-row { display: flex; gap: 4px; align-items: center; width: 100%; }
        .qty-counter { display: flex; border: 1px solid #CCCCCC; border-radius: 3px; flex: 1; overflow: hidden; height: 38px; }
        .qty-btn { background-color: #FFFFFF; border: none; color: #888888; width: 34px; font-size: 1.1rem; cursor: pointer; }
        .qty-btn.left-minus { border-right: 1px solid #E5E5E5; }
        .qty-btn.right-plus { border-left: 1px solid #E5E5E5; }
        .qty-input { flex: 1; background-color: #FFFFFF; border: none; color: #000000; text-align: center; font-size: 0.9rem; width: 100%; outline: none; font-weight: bold; }
        .btn-square-lg { background-color: #FFFFFF; border: 1px solid #CCCCCC; color: #333333; padding: 0 4px; border-radius: 3px; font-size: 0.85rem; height: 38px; min-width: 62px; text-align: center; box-sizing: border-box; line-height: 1.2; }
        .checkbox-group { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; color: #333333; }
        .checkbox-group input { width: 15px; height: 15px; accent-color: #55B2B5; border: 1px solid #CCC; }
        .yellow-highlight-box { display: flex; border: 1px solid #CCCCCC; border-radius: 3px; flex: 1; overflow: hidden; height: 38px; background-color: #FFF2CC; }
        .yellow-input { flex: 1; background-color: #FFF2CC; border: none; color: #333333; font-weight: bold; text-align: center; font-size: 0.95rem; outline: none; }

        .btn-huge-buy { background-color: #B5527F; border: none; color: #FFFFFF; padding: 14px; font-size: 1.2rem; font-weight: bold; width: 100%; text-align: center; box-sizing: border-box; letter-spacing: 1px; margin-top: auto; border-radius: 3px; cursor: pointer; }
        .bottom-banner-text { background-color: #F6F6F6; padding: 6px 12px; font-size: 0.8rem; color: #444444; border-top: 1px solid #E5E5E5; display: flex; align-items: center; gap: 6px; }
        .badge-purple { background-color: #E2D1F9; color: #7B3EBF; font-size: 0.7rem; padding: 1px 4px; border-radius: 8px; font-weight: bold; }

        /* 🛠️ MTS 국룰 하단 4단 탭 바 스타일 (형의 원본 규격 완벽 고수) */
        .nav-tab-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 55px;
            background-color: #FFFFFF; border-top: 1px solid #E5E5E5;
            display: flex; align-items: center; justify-content: space-around;
            box-sizing: border-box; z-index: 9999;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #777777; font-size: 0.8rem; width: 25%; font-weight: 500; text-decoration: none; height: 100%;
        }
        .nav-item.active {
            color: #222222; font-weight: bold;
        }
        .nav-item span {
            display: block;
        }

        .wrapper { padding-bottom: 55px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <div class="header-left">
            <span class="back-arrow" onclick="location.href='/'">←</span>
            <div class="header-tabs">
                <span class="active">주식주문</span>
                <span>미체결</span>
                <span>잔고</span>
                <span>주식더모으기</span>
            </div>
        </div>
        <div class="header-right">⋮</div>
    </header>

    <a href="/main?stock_name={{ stock_name }}&account_name={{ account_name }}&page=search" class="stock-info-link">
        <div class="stock-info-bar">
            <div class="stock-title-box">
                <div class="stock-title-row">
                    <span class="star-icon">☆</span>
                    <h3>STU {{ stock_name if stock_name else '한국건강 2배' }}</h3>
                    <span class="search-icon">🔍 종목검색</span>
                </div>
                <div class="stock-tags">
                    <span class="tag-free">무료</span>
                    <span class="tag-percent">증100</span>
                    <span class="tag-code">{{ stock_code if stock_code else '700768' }} · ETF</span>
                </div>
            </div>
            <div class="stock-price-box">
                <p class="current-price" id="top-current-price">00,000</p>
                <p class="price-change" id="top-price-change">▼ 0 &nbsp; 0.00%</p>
            </div>
        </div>
    </a>

    <div class="account-bar">
        <span class="tag-yui">유의</span>
        <select class="select-box"><option>{{ account_name }}</option></select>
        <input type="password" class="input-box" placeholder="비밀번호 입력">
        <button class="btn-square-sm">환전</button>
    </div>

    <div class="order-action-tabs">
        <div class="action-tab buy">매수</div>
        <div class="action-tab">매도</div>
        <div class="action-tab">정정/취소</div>
        <div class="action-tab more">⋮</div>
    </div>

    <div class="sub-menu-bar">
        <div class="sub-menu-item active">호가</div>
        <div class="sub-menu-item">차트</div>
        <div class="sub-menu-item">체결가</div>
    </div>

    <div class="trade-container">
        <div class="hoga-window" id="hoga-window-target"></div>

        <div class="order-form">
            <div class="form-row">
                <select class="select-box"><option>시장가</option></select>
                <button class="btn-square-lg">주식<br>더모으기</button>
            </div>

            <div class="form-row">
                <div class="qty-counter">
                    <button class="qty-btn left-minus">—</button>
                    <input type="text" class="qty-input" id="order-qty" value="1주" readonly>
                    <button class="qty-btn right-plus">+</button>
                </div>
                <button class="btn-square-lg">미리<br>계산</button>
            </div>

            <div class="form-row" style="justify-content: space-between; margin: 2px 0;">
                <div class="checkbox-group">
                    <input type="checkbox" id="misu-check"><label for="misu-check">미수수량</label>
                </div>
                <select class="select-box" style="max-width: 75px;"><option>0%</option></select>
                <button class="btn-square-lg" style="height:32px;">가능</button>
            </div>

            <div class="form-row">
                <div class="checkbox-group">
                    <input type="checkbox" id="auto-check"><label for="auto-check">가격자동</label>
                </div>
                <select class="select-box" style="height:32px;"><option>현재가대비 0%</option></select>
            </div>

            <div class="form-row">
                <div class="yellow-highlight-box">
                    <button class="qty-btn" id="price-minus">—</button>
                    <input type="text" class="yellow-input" id="order-price-input" value="0원">
                    <button class="qty-btn" id="price-plus">+</button>
                </div>
            </div>

            <div style="font-size: 0.72rem; color: #666666; display: flex; justify-content: space-between; padding: 0 2px;" id="total-calc-banner">
                <span>총 평가금액</span>
                <span style="color:#000; font-weight:bold;">0원</span>
            </div>

            <button class="btn-huge-buy" onclick="executeBuyOrder()">매수 주문</button>
        </div>
    </div>

    <div class="bottom-banner-text">
        <span class="badge-purple">지수 채팅</span>
        <span>이제 님 차례에요-들어와서 한 마디만 던져봐요</span>
    </div>

    <nav class="nav-tab-bar">
        <a href="/main?stock_name={{ stock_name }}&account_name={{ account_name }}&page=search" class="nav-item">
            <span>검색</span>
        </a>
        <a href="/main?stock_name={{ stock_name }}&account_name={{ account_name }}&page=main" class="nav-item active">
            <span>주문</span>
        </a>
        <a href="/main?stock_name={{ stock_name }}&account_name={{ account_name }}&page=news" class="nav-item">
            <span>뉴스</span>
        </a>
        <a href="/main?stock_name={{ stock_name }}&account_name={{ account_name }}&page=account" class="nav-item">
            <span>자산</span>
        </a>
    </nav>
</div>

<script>
    const serverBasePrice = parseInt("{{ base_price if base_price else 30000 }}");

    let currentPrice = serverBasePrice;
    let qty = 1;

    const tickSize = serverBasePrice >= 50000 ? 100 : 50;
    let volumes = [12, 542, 8, 4, 1, 28, 2, 84].map(() => Math.floor(Math.random() * 200) + 5);

    function updateUI() {
        document.getElementById('top-current-price').innerText = currentPrice.toLocaleString();

        const diff = currentPrice - serverBasePrice;
        const rate = ((diff / serverBasePrice) * 100).toFixed(2);
        const sign = diff > 0 ? "▲" : (diff < 0 ? "▼" : "");
        const color = diff > 0 ? "#D9383A" : (diff < 0 ? "#2B66CC" : "#000000");

        const priceChangeEl = document.getElementById('top-price-change');
        priceChangeEl.innerHTML = `${sign} ${Math.abs(diff).toLocaleString()} &nbsp; ${rate}%`;
        priceChangeEl.style.color = color;
        document.getElementById('top-current-price').style.color = color;

        document.getElementById('order-price-input').value = currentPrice.toLocaleString() + "원";
        document.getElementById('total-calc-banner').querySelector('span:last-child').innerText = (currentPrice * qty).toLocaleString() + "원";

        const hogaWindow = document.getElementById('hoga-window-target');
        hogaWindow.innerHTML = '';

        for (let i = 5; i >= 1; i--) {
            const price = serverBasePrice + (i * tickSize);
            const r = (((price - serverBasePrice) / serverBasePrice) * 100).toFixed(2);
            const isCurrent = (price === currentPrice);

            const row = document.createElement('div');
            row.className = `hoga-row ask ${isCurrent ? 'highlight-bg' : ''}`;
            row.style.border = isCurrent ? '2px solid #4386F7' : '';
            row.onclick = () => { currentPrice = price; updateUI(); };

            row.innerHTML = `
                <div class="hoga-price"><span>${price.toLocaleString()}</span><span class="hoga-won">${price.toLocaleString()}원</span></div>
                <span class="hoga-rate">${r}%</span><span class="hoga-volume">${volumes[5-i]}</span>
            `;
            hogaWindow.appendChild(row);
        }

        for (let i = 1; i <= 3; i++) {
            const price = serverBasePrice - (i * tickSize);
            const r = (((price - serverBasePrice) / serverBasePrice) * 100).toFixed(2);
            const isCurrent = (price === currentPrice);

            const row = document.createElement('div');
            row.className = `hoga-row bid ${isCurrent ? 'highlight-bg' : ''}`;
            row.style.border = isCurrent ? '2px solid #D9383A' : '';
            row.onclick = () => { currentPrice = price; updateUI(); };

            row.innerHTML = `
                <div class="hoga-price"><span>${price.toLocaleString()}</span><span class="hoga-won">${price.toLocaleString()}원</span></div>
                <span class="hoga-rate">${r}%</span><span class="hoga-volume">${volumes[4+i]}</span>
            `;
            hogaWindow.appendChild(row);
        }
    }

    setInterval(() => {
        const rand = Math.random();
        if (rand < 0.4) {
            const direction = Math.random() > 0.5 ? 1 : -1;
            currentPrice += (direction * tickSize);

            if (currentPrice > serverBasePrice + (4 * tickSize)) currentPrice = serverBasePrice + (4 * tickSize);
            if (currentPrice < serverBasePrice - (2 * tickSize)) currentPrice = serverBasePrice - (2 * tickSize);
        }

        volumes = volumes.map(v => {
            const delta = Math.floor(Math.random() * 11) - 5;
            const newV = v + delta;
            return newV < 1 ? 1 : newV;
        });

        updateUI();
    }, 2000);

    document.querySelector('.qty-btn.left-minus').addEventListener('click', () => { if(qty > 1) { qty--; document.getElementById('order-qty').value = qty + "주"; updateUI(); } });
    document.querySelector('.qty-btn.right-plus').addEventListener('click', () => { qty++; document.getElementById('order-qty').value = qty + "주"; updateUI(); });

    document.getElementById('price-minus').addEventListener('click', () => { currentPrice -= tickSize; updateUI(); });
    document.getElementById('price-plus').addEventListener('click', () => { currentPrice += tickSize; updateUI(); });

    function executeBuyOrder() {
        alert(`🔔 [매수 주문 접수 완료]\n\n• 종목명: STU {{ stock_name }}\n• 체결가: ${currentPrice.toLocaleString()}원\n• 수량: ${qty}주\n• 총액: ${(currentPrice * qty).toLocaleString()}원\n\n성공적으로 거래가 체결되어 자산 포트폴리오에 반영되었습니다.`);
    }

    window.onload = () => { updateUI(); };
</script>
</body>
</html>
