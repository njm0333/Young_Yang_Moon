<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영양문 모바일 - 종목검색</title>
    <style>
        /* MTS 화이트 테마 완벽 동기화 초기화 */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #FFFFFF;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: #000000; overflow: hidden;
            -webkit-user-select: none; user-select: none;
        }

        .wrapper { display: flex; flex-direction: column; height: 100%; }

        /* 1. 최상단 헤더 바 */
        header {
            background-color: #FFFFFF; padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #E5E5E5;
        }
        .header-left { display: flex; align-items: center; gap: 6px; color: #666666; font-size: 0.85rem; cursor: pointer; }
        .refresh-icon { font-size: 1.1rem; rotate: -45deg; display: inline-block; }
        .header-title { font-size: 1.2rem; font-weight: bold; color: #000000; letter-spacing: -0.5px; margin: 0 auto 0 24%; }
        .close-btn { font-size: 1.4rem; font-weight: 300; color: #888888; cursor: pointer; padding: 0 4px; }

        /* 2. 메인 탭 (사진인식 vs 직접검색) */
        .search-type-tabs { display: flex; border-bottom: 1px solid #D5D5D5; background-color: #FFFFFF; }
        .type-tab { flex: 1; text-align: center; padding: 12px 0; font-size: 1.1rem; font-weight: bold; color: #666666; cursor: pointer; }
        .type-tab.active { color: #2F528F; border-bottom: 3px solid #2F528F; font-weight: 900; }

        /* 3. 종목 검색창 */
        .search-bar-container { padding: 12px 14px; background-color: #FFFFFF; border-bottom: 1px solid #E5E5E5; }
        .search-input-wrapper { display: flex; align-items: center; border: 1px solid #999999; border-radius: 3px; padding: 0 10px; background-color: #FFFFFF; height: 40px; }
        .search-input { flex: 1; border: none; outline: none; font-size: 0.95rem; color: #000000; font-weight: 500; }
        .search-input::placeholder { color: #A9A9A9; }
        .search-submit-btn { background: none; border: none; font-size: 1.2rem; color: #666666; cursor: pointer; display: flex; align-items: center; }

        /* 4. 서브 필터 탭 바 (최근, 음식, 가공식품 딱 3개 고정) */
        .sub-filter-bar { display: flex; background-color: #FFFFFF; border-bottom: 1px solid #E5E5E5; padding: 0 8px; gap: 8px; }
        .filter-item { padding: 12px 14px; font-size: 0.9rem; color: #666666; font-weight: 500; cursor: pointer; text-align: center; }
        .filter-item.active { color: #000000; font-weight: bold; border-bottom: 2px solid #2F528F; }

        /* 5. 리스트 컨테이너 */
        .content-container { flex: 1; overflow-y: auto; background-color: #FFFFFF; }
        .view-pane { display: none; width: 100%; height: 100%; }
        .view-pane.active { display: block; }

        /* 사진 인식 구역 */
        .photo-upload-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80%; padding: 40px 20px; text-align: center; box-sizing: border-box; }
        .camera-circle { width: 90px; height: 90px; background-color: #F0F4FA; border: 2px dashed #2F528F; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #2F528F; cursor: pointer; margin-bottom: 18px; }
        #hidden-camera-input { display: none; }

        /* 6. 오리지널 HTS 리스트 레이아웃 */
        .food-list-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 16px; border-bottom: 1px solid #F2F2F2; cursor: pointer;
        }
        .food-list-row:active { background-color: #F9F9F9; }
        .food-left-info { display: flex; align-items: center; gap: 14px; }
        .food-code { font-size: 0.85rem; color: #888888; font-family: monospace; width: 52px; }
        .food-name { font-size: 0.95rem; font-weight: bold; color: #222222; }

        /* 우측 메타 배너 정렬 파트 */
        .food-right-meta { display: flex; align-items: center; gap: 6px; }

        /* 이미지 속 185 kcal 노란색 박스 구현 */
        .badge-kcal {
            background-color: #FFF2CC; border: 1px solid #FCD366; color: #B25E00;
            padding: 3px 6px; border-radius: 2px; font-size: 0.78rem; font-weight: bold;
            min-width: 50px; text-align: center;
        }
        /* 이미지 속 우측 대분류명 투명 박스 구현 */
        .tag-category {
            border: 1px solid #CCCCCC; background-color: #FFFFFF; color: #666666;
            padding: 3px 6px; border-radius: 2px; font-size: 0.75rem;
            min-width: 50px; text-align: center;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <div class="header-left" onclick="location.reload();">
            <span class="refresh-icon">↻</span>
            <span>종목정보<br>다시받기</span>
        </div>
        <div class="header-title">종목검색</div>
        <div class="close-btn" onclick="history.back();">✕</div>
    </header>

    <div class="search-type-tabs">
        <div class="type-tab" id="tab-photo" onclick="switchMainTab('photo')">사진 인식</div>
        <div class="type-tab active" id="tab-direct" onclick="switchMainTab('direct')">직접 검색</div>
    </div>

    <div class="search-bar-container">
        <div class="search-input-wrapper">
            <input type="text" id="food-search-box" class="search-input" placeholder="음식명, 편의점 상품명, 초성 검색">
            <button class="search-submit-btn">🔍</button>
        </div>
    </div>

    <div class="sub-filter-bar">
        <div class="filter-item active" onclick="switchSubFilter('recent', this)">최근</div>
        <div class="filter-item" onclick="switchSubFilter('food', this)">일반 음식</div>
        <div class="filter-item" onclick="switchSubFilter('processed', this)">가공식품</div>
    </div>

    <div class="content-container">
        <div class="view-pane" id="pane-photo">
            <div class="photo-upload-zone">
                <div class="camera-circle" onclick="document.getElementById('hidden-camera-input').click();">📸</div>
                <h3>식단 및 상품 바코드 촬영</h3>
                <p>영양문 AI가 자동으로 종목을 분석합니다.</p>
            </div>
            <input type="file" id="hidden-camera-input" accept="image/*" capture="environment">
        </div>

        <div class="view-pane active" id="pane-direct">
            <div id="dynamic-list-target">
            </div>
        </div>
    </div>
</div>

<script>
    let currentSubMode = 'recent'; // 기본 탭: 최근
    const listTarget = document.getElementById('dynamic-list-target');
    const searchBox = document.getElementById('food-search-box');

    // 고유 종목코드 생성기 (음식명을 기반으로 중복 없는 고유 6자리 코드 부여)
    function generateStockCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        return (Math.abs(hash % 900000) + 100000).toString();
    }

    // 🔄 30MB CSV 풀을 쥐고 있는 파이썬 백엔드 API로부터 데이터를 실시간으로 가져와 리스트를 그리는 핵심 함수
    function fetchAndRender() {
        const query = searchBox.value.trim();

        // Flask 백엔드 검색 라우터로 실시간 비동기(fetch) 요청 발송
        fetch(`/api/search_food?q=${encodeURIComponent(query)}&mode=${currentSubMode}`)
            .then(res => res.json())
            .then(items => {
                listTarget.innerHTML = '';

                if(items.length === 0) {
                    listTarget.innerHTML = `<div style="text-align:center; color:#999; padding:40px; font-size:0.9rem;">일치하는 상장 종목이 없습니다.</div>`;
                    return;
                }

                items.forEach(item => {
                    const code = generateStockCode(item.name);
                    const row = document.createElement('div');
                    row.className = 'food-list-row';

                    // 클릭 시 이름과 칼로리를 파라미터로 매칭하여 거래소 홈으로 복귀
                    row.onclick = () => selectAndTrade(item.name, item.kcal);

                    row.innerHTML = `
                        <div class="food-left-info">
                            <span class="food-code">${code}</span>
                            <span class="food-name">${item.name}</span>
                        </div>
                        <div class="food-right-meta">
                            <span class="badge-kcal">${item.kcal} kcal</span>
                            <span class="tag-category">${item.cat}</span>
                        </div>
                    `;
                    listTarget.appendChild(row);
                });
            })
            .catch(err => {
                console.error("데이터 로드 실패:", err);
                listTarget.innerHTML = `<div style="text-align:center; color:red; padding:40px; font-size:0.9rem;">서버 통신 오류 발생</div>`;
            });
    }

    // 메인 대형 탭 전환 (사진인식 / 직접검색)
    function switchMainTab(type) {
        document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));
        if(type === 'photo') {
            document.getElementById('tab-photo').classList.add('active');
            document.getElementById('pane-photo').classList.add('active');
        } else {
            document.getElementById('tab-direct').classList.add('active');
            document.getElementById('pane-direct').classList.add('active');
        }
    }

    // 서브 카테고리 필터 탭 전환 (최근 / 일반음식 / 가공식품)
    function switchSubFilter(mode, element) {
        document.querySelectorAll('.filter-item').forEach(i => i.classList.remove('active'));
        element.classList.add('active');
        currentSubMode = mode;
        searchBox.value = ''; // 탭 스위칭 시 검색창 텍스트 비우기
        fetchAndRender();
    }

    // 🔍 실시간 타이핑 디렉션 엔진 (글자 입력 즉시 파이썬 서버가 CSV를 조회)
    searchBox.addEventListener('input', fetchAndRender);

    // 💸 종목 선택 완료 시 메인 매수 주문창(main.html)으로 데이터 들고 원격 텔레포트
    function selectAndTrade(name, kcal) {
        const encodedName = encodeURIComponent(name);
        const urlParams = new URLSearchParams(window.location.search);

        // 유저 고유 생성 계좌 번호가 유실되지 않도록 주소창에서 추적 바인딩
        const account = urlParams.get('account_name') || '6084-2227 [위탁종합]';

        // 메인 거래창(main.html)으로 다이내믹 파라미터 밀어 넣기
        location.href = `/main?stock_name=${encodedName}&account_name=${encodeURIComponent(account)}&page=main`;
    }

    // 브라우저 렌더링이 완료되는 즉시 '최근 상장 추천 종목' 모드로 화면 송출
    window.onload = () => { fetchAndRender(); };
</script>
</body>
</html>
